<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="promSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="60%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>

    <!-- Dark Humus / PROM Granules Gradient -->
    <radialGradient id="promCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b1d11" />
      <stop offset="45%" stop-color="#241008" />
      <stop offset="85%" stop-color="#140804" />
      <stop offset="100%" stop-color="#0a0301" />
    </radialGradient>

    <linearGradient id="promLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#582a18" />
      <stop offset="50%" stop-color="#3d1b0f" />
      <stop offset="100%" stop-color="#1a0904" />
    </linearGradient>

    <!-- Phosphate Rock & Mineral Specs Gradient -->
    <linearGradient id="mineralRockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="promShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e0f08" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="200" height="160" rx="8" fill="#f8fafc" />
  
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect width="200" height="160" rx="8" />
    </clipPath>

    <!-- Sky -->
    <rect x="0" y="0" width="200" height="70" fill="url(#promSkyGrad)" />
    
    <!-- Distant Forest/Hedge line -->
    <path d="M 0 55 Q 30 40 65 48 Q 110 38 150 48 Q 180 40 200 52 L 200 80 L 0 80 Z" fill="#15803d" />
    <path d="M 0 60 Q 40 50 80 58 Q 120 48 160 56 Q 185 52 200 62 L 200 80 L 0 80 Z" fill="#4ade80" opacity="0.4" />

    <!-- Farm Soil Ground -->
    <rect x="0" y="75" width="200" height="85" fill="#c29b68" />

    <!-- Dark PROM Granule Mound -->
    <ellipse cx="100" cy="130" rx="88" ry="18" fill="#140804" opacity="0.5" />

    <path d="M 12 130 
             C 18 105, 45 76, 75 64 
             C 90 58, 110 58, 125 64 
             C 155 76, 182 105, 188 130 
             C 180 140, 135 144, 100 144 
             C 65 144, 20 140, 12 130 Z" 
          fill="url(#promCore)" />

    <!-- Top Ridge and Granular Humus -->
    <path d="M 75 64 
             C 85 60, 115 60, 125 64 
             C 145 76, 160 92, 170 112 
             C 145 102, 120 98, 95 102 
             C 65 106, 40 115, 30 112 
             C 40 92, 55 76, 75 64 Z" 
          fill="url(#promLight)" />

    <!-- Mineral Phosphate & Bone Meal Granules -->
    <circle cx="55" cy="85" r="3" fill="url(#mineralRockGrad)" stroke="#581c87" stroke-width="0.5" />
    <circle cx="85" cy="74" r="3.5" fill="url(#mineralRockGrad)" stroke="#581c87" stroke-width="0.5" />
    <circle cx="115" cy="78" r="3" fill="url(#mineralRockGrad)" stroke="#581c87" stroke-width="0.5" />
    <circle cx="145" cy="92" r="3.5" fill="url(#mineralRockGrad)" stroke="#581c87" stroke-width="0.5" />
    <circle cx="70" cy="110" r="2.8" fill="url(#mineralRockGrad)" stroke="#581c87" stroke-width="0.5" />
    <circle cx="120" cy="112" r="3.2" fill="url(#mineralRockGrad)" stroke="#581c87" stroke-width="0.5" />
    <circle cx="155" cy="118" r="2.5" fill="url(#mineralRockGrad)" stroke="#581c87" stroke-width="0.5" />

    <!-- Bio-granules texture -->
    <circle cx="40" cy="120" r="2" fill="#582a18" />
    <circle cx="95" cy="95" r="2.5" fill="#6c341e" />
    <circle cx="132" cy="98" r="2" fill="#582a18" />
    <circle cx="102" cy="125" r="2" fill="#6c341e" />

    <!-- Bio-Phosphorus Badge -->
    <g transform="translate(132, 20)">
      <rect x="0" y="0" width="58" height="18" rx="9" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="0.8" />
      <text x="29" y="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#7e22ce">ORGANIC P</text>
    </g>
  </g>
</svg>
