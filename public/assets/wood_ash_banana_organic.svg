<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <!-- Background sky & farm lighting -->
    <linearGradient id="ashSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Clay Pot Gradients -->
    <linearGradient id="clayPotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="35%" stop-color="#c2410c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Wood Ash Powder Gradients -->
    <linearGradient id="woodAshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Banana Peel Rich Yellow Gradients -->
    <linearGradient id="bananaPeelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Bio-Liquid / Extract Gradient -->
    <linearGradient id="bioLiquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#542e0c" />
      <stop offset="100%" stop-color="#271506" />
    </linearGradient>

    <filter id="extractShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="200" height="160" rx="8" fill="#f8fafc" />
  
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect width="200" height="160" rx="8" />
    </clipPath>

    <!-- Background -->
    <rect x="0" y="0" width="200" height="75" fill="url(#ashSkyGrad)" />
    
    <!-- Farm soil ground -->
    <rect x="0" y="70" width="200" height="90" fill="#d4b996" />
    <path d="M 0 70 Q 50 64 100 70 T 200 68 L 200 160 L 0 160 Z" fill="#b99264" />

    <!-- Distant green foliage -->
    <path d="M 0 65 Q 30 52 65 60 Q 110 50 145 60 Q 175 52 200 64 L 200 72 L 0 72 Z" fill="#22c55e" opacity="0.6" />

    <!-- Fermented Extract Clay Jar / Vessel -->
    <g filter="url(#extractShadow)">
      <!-- Vessel Shadow on ground -->
      <ellipse cx="68" cy="138" rx="42" ry="12" fill="#452714" opacity="0.4" />

      <!-- Terracotta Pot -->
      <path d="M 38 78 
               C 32 95, 30 115, 36 130 
               C 42 140, 94 140, 100 130 
               C 106 115, 104 95, 98 78 Z" 
            fill="url(#clayPotGrad)" stroke="#7c2d12" stroke-width="0.8" />
      
      <!-- Pot Rim -->
      <ellipse cx="68" cy="78" rx="30" ry="8" fill="#9a3412" stroke="#7c2d12" stroke-width="0.8" />
      
      <!-- Dark Fermented Bio Extract Liquid surface -->
      <ellipse cx="68" cy="80" rx="26" ry="6.5" fill="url(#bioLiquidGrad)" />
      <!-- Liquid light reflection -->
      <path d="M 52 80 Q 68 76 84 80" stroke="#facc15" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
      <circle cx="64" cy="81" r="1.5" fill="#facc15" opacity="0.8" />
      <circle cx="75" cy="79" r="1.2" fill="#facc15" opacity="0.7" />
    </g>

    <!-- Natural Fermented Banana Peels draping -->
    <g filter="url(#extractShadow)">
      <!-- Banana Peel 1 -->
      <path d="M 58 78 
               C 46 88, 30 105, 24 125 
               C 22 132, 28 135, 32 132 
               C 40 120, 52 102, 64 86 Z" 
            fill="url(#bananaPeelGrad)" stroke="#854d0e" stroke-width="0.7" />
      
      <!-- Banana skin fiber / crown -->
      <path d="M 23 128 Q 28 130 31 127" stroke="#3e2307" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 28 120 Q 36 110 48 95" stroke="#713f12" stroke-width="0.8" stroke-dasharray="2,2" fill="none" />

      <!-- Banana Peel 2 (Curled) -->
      <path d="M 72 78 
               C 85 92, 102 110, 115 118 
               C 122 122, 126 118, 122 112 
               C 112 98, 95 86, 78 78 Z" 
            fill="url(#bananaPeelGrad)" stroke="#854d0e" stroke-width="0.7" />
      <path d="M 118 116 Q 123 118 124 114" stroke="#3e2307" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- Natural Wood Ash Heap & Biochar on the right -->
    <g filter="url(#extractShadow)">
      <!-- Base Ash shadow -->
      <ellipse cx="145" cy="138" rx="44" ry="12" fill="#1e293b" opacity="0.35" />

      <!-- Wood Ash Mound -->
      <path d="M 106 138 
               C 112 115, 128 92, 145 88 
               C 162 92, 178 115, 186 138 
               C 175 144, 118 144, 106 138 Z" 
            fill="url(#woodAshGrad)" stroke="#94a3b8" stroke-width="0.7" />

      <!-- Ash Texture folds & Charcoal flecks -->
      <path d="M 125 125 Q 145 112 165 122" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" fill="none" opacity="0.5" />
      <path d="M 135 105 Q 148 98 160 108" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.7" />
      
      <!-- Charcoal chunks (Biochar / Wood carbon) -->
      <polygon points="140,118 148,114 146,124 138,122" fill="#1e293b" />
      <polygon points="155,128 164,124 162,132 153,130" fill="#0f172a" />
      <polygon points="128,132 134,128 132,135 126,134" fill="#1e293b" />
      <circle cx="150" cy="100" r="1.5" fill="#334155" />
      <circle cx="138" cy="110" r="1.2" fill="#334155" />
    </g>

    <!-- Fresh Green Herbal Sprig (Agronomic purity emblem) -->
    <g transform="translate(94, 98) rotate(-15)">
      <path d="M 0 20 Q 8 8 16 0" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <path d="M 6 12 C 6 12, 1 6, 4 2 C 7 -2, 12 3, 12 3 C 12 3, 11 8, 6 12 Z" fill="#22c55e" stroke="#166534" stroke-width="0.5" />
      <path d="M 12 6 C 12 6, 16 1, 20 2 C 24 3, 22 9, 22 9 C 22 9, 17 9, 12 6 Z" fill="#16a34a" stroke="#166534" stroke-width="0.5" />
    </g>

    <!-- Potassium K+ Badge Label -->
    <g transform="translate(132, 22)">
      <rect x="0" y="0" width="58" height="18" rx="9" fill="#fef3c7" stroke="#fde047" stroke-width="0.8" />
      <text x="29" y="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#92400e">ORGANIC K+</text>
    </g>
  </g>
</svg>
