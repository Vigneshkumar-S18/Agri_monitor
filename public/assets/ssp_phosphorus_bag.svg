<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pBagBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="12%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <linearGradient id="pBagTopSeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#e9d5ff" />
      <stop offset="70%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="pLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="pBagShadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#pBagShadow)">
    <path d="M 36 28 Q 100 24 164 28 L 168 40 Q 100 36 32 40 Z" fill="url(#pBagTopSeam)" stroke="#cbd5e1" stroke-width="0.8" />
    <path d="M 35 34 Q 100 30 165 34" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2.5" fill="none" opacity="0.85" />
    
    <path d="M 32 40 
             C 24 95, 20 160, 26 210 
             C 28 218, 42 222, 100 222 
             C 158 222, 172 218, 174 210 
             C 180 160, 176 95, 168 40 
             Q 100 36 32 40 Z" 
          fill="url(#pBagBody)" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- Side shading -->
  <path d="M 32 40 C 26 100, 22 170, 28 210 C 35 210, 45 160, 48 40 Z" fill="#000000" opacity="0.04" />
  <path d="M 168 40 C 174 100, 178 170, 172 210 C 165 210, 155 160, 152 40 Z" fill="#000000" opacity="0.05" />

  <!-- Packaging Header -->
  <rect x="52" y="58" width="96" height="4" rx="2" fill="#9333ea" opacity="0.8" />

  <text x="100" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#0f172a" letter-spacing="0.5">SSP (16% P₂O₅)</text>
  <text x="100" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#9333ea" letter-spacing="0.3">SINGLE SUPER PHOSPHATE</text>

  <!-- Root & Flower Emblem -->
  <g transform="translate(86, 122) scale(0.95)">
    <circle cx="14" cy="18" r="14" fill="url(#pLogoGrad)" />
    <path d="M 14 10 L 14 26 M 10 18 L 18 18 M 11 13 L 17 23 M 17 13 L 11 23" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Quality Badge -->
  <g transform="translate(68, 172)">
    <rect x="0" y="0" width="64" height="16" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.7" />
    <text x="32" y="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#7e22ce">ROOT & FLOWER</text>
  </g>

  <path d="M 38 214 Q 100 216 162 214" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2" />
</svg>
